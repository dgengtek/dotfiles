session_name: "privat"
start_directory: "${PWD}" # load session relative to config location (project root).
windows:
  - window_name: intentm
    focus: True
    #layout: main-horizontal
    panes:
      - shell_command:
          - task
  - window_name: privat
    layout: main-vertical
    #options:
    #  main-pane-height: 35
    panes:
      - shell_command:
          - while ! test -d "${HOME}/mnt/privat/dokumente/"; do sleep 1; done
          - command cd "${HOME}/mnt/privat/"
  - window_name: accounting
    #layout: main-horizontal
    start_directory: "${XDG_DATA_HOME}/repos/accounting"
    panes:
      - shell_command:
          - ledger b
