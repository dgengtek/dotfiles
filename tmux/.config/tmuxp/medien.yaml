session_name: "medien"
start_directory: "${HOME}" # load session relative to config location (project root).
windows:
  - window_name: neomutt
    focus: True
    #layout: main-horizontal
    panes:
      - shell_command:
          - |
            mkdir /tmp/startup_gpg2_lock \
            && read \
            && mkdir -p ${HOME}/mnt/privat \
            && retry.sh "gocryptfs -- /auto/data/privat ${HOME}/mnt/privat" \
            && gpg-connect-agent updatestartuptty /bye \
            && rmdir /tmp/startup_gpg2_lock \
            && neomutt
  - window_name: 'music'
    layout: even-vertical
    panes:
      - shell_command:
          - |
            command cd ${HOME}/Musik \
            && mpc \
            && prompt_run.py --format pueue add -g q -- '"yt-dlp -f '"'"'(bestvideo[width>=1920]/bestvideo)+bestaudio/best'"'"' -x --no-playlist --output '"'"'%(title)s.%(ext)s'"'"' '"'"'{}'"'"'"'
      - shell_command:
          - |
            while ! test -d '/auto/data/music/'; do sleep 1; done \
            && command cd /auto/data/music/ \
            && fzf
